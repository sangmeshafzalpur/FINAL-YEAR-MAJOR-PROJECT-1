# Netlify configuration when deploying directly from the frontend directory
[build]
  publish = "."
  command = "sed -i \"s|__PLACEHOLDER_API_URL__|${API_BASE_URL}|g\" js/config.js || true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
