# netlify.toml
# Netlify deployment configuration for ChilliFusionNet Frontend.
# Placed at repository root so Netlify automatically configures the build.

[build]
  base = "chillifusionnet_app"
  command = "sed -i \"s|__PLACEHOLDER_API_URL__|${API_BASE_URL}|g\" frontend/js/config.js || true"
  publish = "frontend"
  environment = { NODE_VERSION = "20" }

[build.environment]
  API_BASE_URL = "https://YOUR-RENDER-SERVICE.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
